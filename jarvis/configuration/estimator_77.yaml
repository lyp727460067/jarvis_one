%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 1         
num_of_cam: 2  

imu_topic: "/imu"
image0_topic: "/usb_cam_1/image_raw/compressed"
image1_topic: "/usb_cam_2/image_raw/compressed"
output_path: "/home/lyp/project/catkin_ws/log"
data_capture: 0
