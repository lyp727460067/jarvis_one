#data_folder: "/home/lyp/project/bag/15/sys_data/15/caodi/calib_save.bag"
cam0_calib: "ld_cam0_77.yaml"
cam1_calib: "ld_cam1_77.yaml"
image_width: 640
image_height: 544
imu_cam_time_offset: 0.005 #1123
#imu_cam_time_offset:  -0.09597202515969253 #for 1209
image_sample : 1
record : 0
offline_play_bag_duration : 0.001 

mask_id: mask.png


# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 1   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data:  [0.004278094939249882, -0.008781514712983385, -0.9999522903134112, -0.03265168587124466,
          0.9999883505210795, 0.002272838395565302, 0.00425828929951011, -0.03861822650981798,
          0.0022353357290220144, -0.9999588587561857, 0.00879113583135066, 0.04237282279723379,
          0.0, 0.0, 0.0, 1.0]

   # data: [0.004119637854333169, 0.9999896970386508, 0.0019064103693632872, -0.01982065921660834, 
   #        0.018578720105320412, -0.0019826356023358582, 0.9998254349211748, 0.04645290656552592, 
   #        0.9998189134754338, -0.004083500044768096, -0.018586696430163863, -0.08745878678942877, 
   #        0.000000000000, 0.000000000000, 0.000000000000, 1.000000000000]



body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0.00805418108864972, -0.012976385246538658, -0.9998833649946003, -0.03426593099017232, 
          0.9998453634446182, -0.01552732376971716, 0.008255387020022986, 0.041688009792324746, 
          -0.015632637822556528, -0.9997952368572698, 0.01284931874555939, 0.04227918368552841, 
           0.000000000000, 0.000000000000, 0.000000000000, 1.000000000000]

 
multiple_thread: 0

#feature traker paprameters

max_cnt: 80          # max feature number in feature tracking
min_dist: 40            # min distance between two features 
freq: 10                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image 
F_threshold: 1.0        # ransac threshold (pixel)
fast_th: 10 
show_track: 0           # publish tracking image as topic
flow_back: 1           # perform forward and backward optical flow to improve feature tracking accuracy
lk_win_size : 21
lk_pre_max_layer : 4
#optimization parameters
max_solver_time: 0.05  # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 20.0 # keyframe selection threshold (pixel)

#imu parameters       The more accurate parameters you provide, the better performance
acc_n: 0.03        # accelerometer measurement noise standard deviation. 
gyr_n: 0.001        # gyroscope measurement noise standard deviation.     
acc_w: 0.001        # accelerometer bias random work noise standard deviation.  
gyr_w: 0.001       # gyroscope bias random work noise standard deviation.     
g_norm: 9.81007     # gravity magnitude

##
UpdataZeroVelocityOption:
  enable: 1
  optimize_weight: 1e2
  optimize_bias_weight: 1e1
  outlier_max_disparity: 1
  zupt_max_velocity: 1.0
  zupt_delay_frames: 1
  imu_velocity_option :
    integrated_accel_constraint: 0
    zupt_noise_multiplier: 1.0
    zupt_chi2_multipler: 0.2
  imag_disparity_option:
    min_disparity_num: 20
    max_disparity: 0.35
  que_time_duration: 0.5


track_feat_lost_min_num: 2
track_feat_lost_win_size :  10
bas_norm_max : 1
bgs_norm_max : 0.5
translation_norm_max : 0.5
translation_z_max : 0.5
ratation_max : 10

#unsynchronization parameters
estimate_td: 0                      # online estimate time offset between camera and imu
td: 0                                  # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#optimization parameters
max_num_iterations: 1   # max solver itrations, to guarantee real time
