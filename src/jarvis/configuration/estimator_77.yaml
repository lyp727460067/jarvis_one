%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
use_stero : 1   #  0 vector 0 cam0:    1   used vecotr{0,1} stereo
win_size : 6
data_base_lenth : 1

track_sequence: "{0,1},{2}"
#feature traker paprameters

feattrack0:
  max_cnt: 60          # max feature number in feature tracking
  min_dist:  35           # min distance between two features 
  mask_min_dist:  40  
  F_threshold: 1.0        # ransac threshold (pixel)
  fast_th:  15
  flow_back: 1           # perform forward and backward optical flow to improve feature tracking accuracy
  lk_win_size : 7
  lk_pre_max_layer : 3
  grid_size_x : 64
  grid_size_y : 68
  klt_type : 1
  back_flow_min_distance : 0.4
  mask : mask.png
####
feattrack1:
  max_cnt: 30          # max feature number in feature tracking
  min_dist:  35           # min distance between two features 
  mask_min_dist: 40  
  F_threshold: 1.0        # ransac threshold (pixel)
  fast_th:  15
  flow_back: 1           # perform forward and backward optical flow to improve feature tracking accuracy
  lk_win_size : 7
  lk_pre_max_layer : 3
  grid_size_x : 68
  grid_size_y : 64
  klt_type : 1
  back_flow_min_distance : 0.3
  mask : mask0.png
feattrack2:
  max_cnt: 20          # max feature number in feature tracking
  min_dist:  45           # min distance between two features 
  mask_min_dist:  30  
  F_threshold: 1.0        # ransac threshold (pixel)
  fast_th:  15
  flow_back: 1           # perform forward and backward optical flow to improve feature tracking accuracy
  lk_win_size : 7
  lk_pre_max_layer : 3
  grid_size_x : 68
  grid_size_y : 64
  klt_type : 1
  mask : mask0.png


optimization: 
#optimization parameters
  max_solver_time: 0.05  # max solver itration time (ms), to guarantee real time
  max_num_iterations: 1   # max solver itrations, to guarantee real time
  use_odom : 1
  camera_weight : 251
  estimate_extrinsic: 1  # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.
  huber_loss : 1
  #unsynchronization parameters
  estimate_td: 0                    # online estimate time offset between camera and imu
  td: 0                                  # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)
  camera_factor_num_th : 10

init_optimization: 
  max_solver_time: 0.05  # max solver itration time (ms), to guarantee real time
  max_num_iterations: 10   # max solver itrations, to guarantee real time
  use_odom : 0
  camera_weight : 350 
  estimate_extrinsic: 0  # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

  huber_loss : 1
  #unsynchronization parameters
  estimate_td: 0                     # online estimate time offset between camera and imu
  td: 0                                  # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

  

feature_manager :
  convin_used_num : 4
  keyframe_parallax: 20.0 # keyframe selection threshold (pixel)
  init_depth : 5.0
  init_pnp_inlier_num : 10
  ###ParallaxOption
  start_frame : 2
  last_track_num : 20
  long_track_num : 10
  new_feature_ration : 0.5
  optimazation_outliers_rejection_th : 5
  rejection_points_depth_max_th : 20

imu_option: 
  #imu parameters       The more accurate parameters you provide, the better performance
  acc_n: 0.1      # accelerometer measurement noise standard deviation. 
  gyr_n: 0.02        # gyroscope measurement noise standard deviation.     
  acc_w: 0.001        # accelerometer bias random work noise standard deviation.  
  gyr_w: 0.001       # gyroscope bias random work noise standard deviation.     
  g_norm: 9.81     # gravity magnitude



odom_option :
  use_odom : 1
  odom_optimization_weight: 50
  angle_threas_hold : 10



##
UpdataZeroVelocityOption:
  enable: 1
  optimize_weight: 3e6
  optimize_bias_weight: 1e1
  outlier_max_disparity: 1
  zupt_max_velocity: 1.0
  zupt_delay_frames: 10
  imu_velocity_option :
    integrated_accel_constraint: false
    zupt_noise_multiplier: 1.0
    zupt_chi2_multipler: 0.2
  imag_disparity_option:
    min_disparity_num: 20
    max_disparity: 0.5
  que_time_duration: 0.5


track_feat_lost_min_num: 10
track_feat_lost_win_size :  10
bas_norm_max : 0.6
bgs_norm_max : 0.5
translation_norm_max : 0.5
translation_z_max : 0.4
ratation_max : 50
enable_odo_zero_lost_detect : 1
zero_translation_norm_max : 0.15
zero_translation_z_max : 0.01
zero_ratation_max : 10.1
zero_odo_win_size : 30
zero_odo_pose_size : 40

init_rotation_th : 20
init_bas_normal_max : 0.3
init_velocity_th : 1.0
